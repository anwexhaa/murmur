# A NodePort for the local cluster only.
#
# The base manifests give the gateway a ClusterIP, which is what a real
# deployment wants: traffic arrives through an Ingress or a LoadBalancer that
# terminates TLS and is owned by the platform rather than by this repository.
# A local k3s has neither, so this is the smallest thing that makes the
# cluster reachable from the host, and it lives in an overlay so it can never
# be applied by accident somewhere it should not be.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: murmur
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { name: http, port: 80, targetPort: 8080, nodePort: 30080 }
