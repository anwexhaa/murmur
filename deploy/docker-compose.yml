name: murmur

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur -d murmur"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # allkeys-lru is the honest policy for this workload: everything in Redis
    # is a derived view of Postgres, so evicting the cold tail costs latency,
    # never correctness. appendonly keeps timelines across a restart so local
    # work does not begin with a cold cache every morning.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    # -js enables JetStream, -sd sets its store directory, -m opens the
    # monitoring port that the healthcheck below reads.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Jaeger all-in-one: OTLP collector, storage and UI in one process. Traces
  # live in memory and vanish on restart, which is right for a development
  # stack — nobody should be reasoning about yesterday's local traces.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP/gRPC
    healthcheck:
      # Jaeger v2's healthcheckv2 extension serves /status; the bare root is a
      # 404, which would keep the container permanently unhealthy.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:13133/status >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  natsdata:
